# Entorno local: PostgreSQL 16 + migraciones + API (con el modelo local dentro de la imagen).
#   export CLASSIFIER_REPO_TOKEN=<token>   # lectura del repositorio privado del clasificador (ver README)
#   docker compose up -d --build
# La primera construcción tarda varios minutos (torch, SBERT); las siguientes usan la caché.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pqrs
      POSTGRES_PASSWORD: pqrs
      POSTGRES_DB: pqrs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pqrs -d pqrs"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Tarea de un solo uso: aplica las migraciones y termina. Usa la misma imagen que `api`
  # (la construye el servicio `api`).
  migrate:
    image: pqrs-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://pqrs:pqrs@db:5432/pqrs
    depends_on:
      db:
        condition: service_healthy

  api:
    image: pqrs-api:local
    build:
      context: .
      secrets: [classifier_token]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pqrs:pqrs@db:5432/pqrs
      # Solo para desarrollo local: en cualquier otro entorno, ENVIRONMENT distinto y un secreto largo
      # y aleatorio (openssl rand -hex 32) y SESSION_COOKIE_SECURE en true.
      ENVIRONMENT: development
      SESSION_COOKIE_SECURE: "false"
      # Secreto que el proxy del dashboard envía en X-PQRS-Proxy-Secret. Con él definido se exige
      # siempre, también en desarrollo; para probar a mano mira "Iniciar sesión con curl" en el README.
      PROXY_SHARED_SECRET: dev-proxy-secret-solo-para-local
      # Sin LLM_API_KEY ni LLM_MODEL el LLM queda `not_configured` y solo funciona `classifier`.
      # LLM_API_KEY: ""
      # LLM_BASE_URL: ""
      # LLM_MODEL: ""
      LOG_LEVEL: INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /ready exige base de datos y modelo local cargado. SBERT tarda unos segundos en cargar.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

# Token de solo lectura del repositorio privado del clasificador (ver README):
#   export CLASSIFIER_REPO_TOKEN=...   (o  CLASSIFIER_REPO_TOKEN=$(gh auth token) docker compose ...)
secrets:
  classifier_token:
    environment: CLASSIFIER_REPO_TOKEN

volumes:
  pgdata:
