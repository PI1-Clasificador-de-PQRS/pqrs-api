[project]
name = "pqrs-api"
version = "0.1.0"
description = "API REST del Clasificador automático de PQRS (MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "typer>=0.15",
    "uvicorn>=0.32",
    "pqrs-classifier[llm,ner]",
    # Modelo de spaCy para el NER de nombres de `anonymize()`: el extra `ner` solo instala spaCy.
    # Sin él, los nombres propios no se anonimizan (la API se niega a arrancar fuera de desarrollo).
    "es-core-news-sm",
    "tzdata>=2026.5",
]

[project.scripts]
pqrs-admin = "app.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.0.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
# Motor local real (SBERT + regresión logística). No se instala por defecto: la CI normal usa
# motores falsos y no necesita torch. La imagen Docker y el job `slow` usan `--group ml`.
ml = [
    "pqrs-classifier[embeddings]",
    # El modelo se entrenó con scikit-learn 1.9.0 (metadata.json del release v0.1.0):
    # `artifacts.load` exige la misma versión mayor.menor y un pickle de otra versión avisa.
    "scikit-learn==1.9.0",
    "torch>=2.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
pqrs-classifier = { git = "https://github.com/PI1-Clasificador-de-PQRS/pqrs-classifier", tag = "v0.1.0" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
# torch de CPU (sin CUDA) en Linux: la imagen pesa cientos de MB menos.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: carga el motor local real (torch, SBERT); no corre por defecto (usar -m slow)",
]
