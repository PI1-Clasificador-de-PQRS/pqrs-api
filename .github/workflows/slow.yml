name: Slow tests

# Pruebas con el motor local real (torch + SBERT). Son pesadas, así que solo corren cuando cambia
# algo que puede romper la carga del motor: dependencias, imagen, código de los motores o el
# arranque de la API. También se pueden lanzar a mano (workflow_dispatch).
on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - app/main.py
      - app/infrastructure/engines/**
      - tests/slow/**
      - .github/workflows/slow.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    env:
      CLASSIFIER_REPO_TOKEN: ${{ secrets.CLASSIFIER_REPO_TOKEN }}
      DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs
      TEST_DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs_test
      SLOW_MODEL_DIR: ${{ github.workspace }}/model
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pqrs
          POSTGRES_PASSWORD: pqrs
          POSTGRES_DB: pqrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pqrs -d pqrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: Allow git to read the private classifier repository
        run: |
          git config --global \
            url."https://x-access-token:${CLASSIFIER_REPO_TOKEN}@github.com/PI1-Clasificador-de-PQRS/pqrs-classifier".insteadOf \
            "https://github.com/PI1-Clasificador-de-PQRS/pqrs-classifier"

      - name: Install dependencies (with the ml group)
        run: uv sync --frozen --group ml

      - name: Download model artifacts from the classifier release
        run: |
          mkdir -p "$SLOW_MODEL_DIR"
          for name in model.joblib metadata.json; do
            asset_id=$(curl -fsSL -H "Authorization: Bearer $CLASSIFIER_REPO_TOKEN" \
              https://api.github.com/repos/PI1-Clasificador-de-PQRS/pqrs-classifier/releases/tags/v0.1.0 \
              | python3 -c "import json,sys; print(next(a['id'] for a in json.load(sys.stdin)['assets'] if a['name']=='$name'))")
            curl -fsSL -H "Authorization: Bearer $CLASSIFIER_REPO_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "$SLOW_MODEL_DIR/$name" \
              "https://api.github.com/repos/PI1-Clasificador-de-PQRS/pqrs-classifier/releases/assets/$asset_id"
          done

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-paraphrase-multilingual-mpnet-base-v2

      - name: Slow tests
        run: uv run pytest -m slow
