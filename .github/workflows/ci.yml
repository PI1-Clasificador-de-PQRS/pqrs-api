name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pqrs
          POSTGRES_PASSWORD: pqrs
          POSTGRES_DB: pqrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pqrs -d pqrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs
      TEST_DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check OpenAPI is up to date
        run: uv run python scripts/export_openapi.py --check

      - name: Tests
        run: uv run pytest
