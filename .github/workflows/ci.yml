name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pqrs
          POSTGRES_PASSWORD: pqrs
          POSTGRES_DB: pqrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pqrs -d pqrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs
      TEST_DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      # `pqrs-classifier` es un repositorio privado: git sustituye su URL por una con el token
      # (de solo lectura) solo para ese repositorio. El token queda enmascarado en los logs y
      # no se escribe en uv.lock. Los PR desde forks no reciben el secreto y fallarán aquí.
      - name: Allow git to read the private classifier repository
        env:
          CLASSIFIER_REPO_TOKEN: ${{ secrets.CLASSIFIER_REPO_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${CLASSIFIER_REPO_TOKEN}@github.com/PI1-Clasificador-de-PQRS/pqrs-classifier".insteadOf \
            "https://github.com/PI1-Clasificador-de-PQRS/pqrs-classifier"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check OpenAPI is up to date
        run: uv run python scripts/export_openapi.py --check

      - name: Tests
        run: uv run pytest

  # Publica la imagen en GHCR solo si las pruebas pasan y el evento es un push (a main o un tag v*).
  # Etiquetas: `main` y `latest` en main, `sha-<commit>` siempre y `X.Y.Z`/`X.Y` en los tags.
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # La etapa builder ocupa varios GB (torch, pesos de SBERT): se libera espacio del runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pi1-clasificador-de-pqrs/pqrs-api
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # El token del clasificador entra como build secret, igual que en local (ver Dockerfile).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            classifier_token=${{ secrets.CLASSIFIER_REPO_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
