name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # nocturno (UTC): job `slow`

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pqrs
          POSTGRES_PASSWORD: pqrs
          POSTGRES_DB: pqrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pqrs -d pqrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs
      TEST_DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      # `pqrs-classifier` es un repositorio privado: git sustituye su URL por una con el token
      # (de solo lectura) solo para ese repositorio. El token queda enmascarado en los logs y
      # no se escribe en uv.lock. Los PR desde forks no reciben el secreto y fallarán aquí.
      - name: Allow git to read the private classifier repository
        env:
          CLASSIFIER_REPO_TOKEN: ${{ secrets.CLASSIFIER_REPO_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${CLASSIFIER_REPO_TOKEN}@github.com/PI1-Clasificador-de-PQRS/pqrs-classifier".insteadOf \
            "https://github.com/PI1-Clasificador-de-PQRS/pqrs-classifier"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check OpenAPI is up to date
        run: uv run python scripts/export_openapi.py --check

      - name: Tests
        run: uv run pytest

  # Pruebas con el motor local real (torch + SBERT). Pesadas: no corren en cada PR.
  slow:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CLASSIFIER_REPO_TOKEN: ${{ secrets.CLASSIFIER_REPO_TOKEN }}
      DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs
      TEST_DATABASE_URL: postgresql+psycopg://pqrs:pqrs@localhost:5432/pqrs_test
      SLOW_MODEL_DIR: ${{ github.workspace }}/model
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pqrs
          POSTGRES_PASSWORD: pqrs
          POSTGRES_DB: pqrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pqrs -d pqrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: Allow git to read the private classifier repository
        run: |
          git config --global \
            url."https://x-access-token:${CLASSIFIER_REPO_TOKEN}@github.com/PI1-Clasificador-de-PQRS/pqrs-classifier".insteadOf \
            "https://github.com/PI1-Clasificador-de-PQRS/pqrs-classifier"

      - name: Install dependencies (with the ml group)
        run: uv sync --frozen --group ml

      - name: Download model artifacts from the classifier release
        run: |
          mkdir -p "$SLOW_MODEL_DIR"
          for name in model.joblib metadata.json; do
            asset_id=$(curl -fsSL -H "Authorization: Bearer $CLASSIFIER_REPO_TOKEN" \
              https://api.github.com/repos/PI1-Clasificador-de-PQRS/pqrs-classifier/releases/tags/v0.1.0 \
              | python3 -c "import json,sys; print(next(a['id'] for a in json.load(sys.stdin)['assets'] if a['name']=='$name'))")
            curl -fsSL -H "Authorization: Bearer $CLASSIFIER_REPO_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "$SLOW_MODEL_DIR/$name" \
              "https://api.github.com/repos/PI1-Clasificador-de-PQRS/pqrs-classifier/releases/assets/$asset_id"
          done

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-paraphrase-multilingual-mpnet-base-v2

      - name: Slow tests
        run: uv run pytest -m slow
